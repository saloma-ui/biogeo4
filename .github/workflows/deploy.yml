name: Publica el web amb MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mkdocs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detecta noves figures i actualitza la documentació
        run: python scripts/actualitza_inventari_figures.py

      - name: Desa les fitxes i els inventaris actualitzats
        run: |
          git add -- figures/fitxes.json docs/inventari-visual.md docs/registre-figures-ud*.md docs/informacio/index.md mkdocs.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: actualitza els registres de figures [skip ci]"
            git push origin HEAD:main
          fi

      - name: Instal·la dependències de Python
        run: pip install -r requirements.txt

      - name: Instal·la Chromium per als PDF
        run: python -m playwright install --with-deps chromium

      - name: Publica amb MkDocs
        run: mkdocs gh-deploy --force

      - name: Comprova els PDF generats
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdfs = sorted(Path('site').rglob('*.pdf'))
          if not pdfs:
              raise SystemExit('No s’ha generat cap PDF.')

          for path in pdfs:
              pages = len(PdfReader(path).pages)
              print(f'{path}: {pages} pàgines')
          PY
