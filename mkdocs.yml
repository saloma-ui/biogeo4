site_name: Biologia i Geologia — 4t d'ESO
site_description: Materials de Biologia i Geologia de 4t d'ESO
site_url: https://saloma-ui.github.io/biogeo4/
repo_url: https://github.com/saloma-ui/biogeo4
repo_name: saloma-ui/biogeo4

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - revealjs:
      transition: slide
      controls: true
      center: true
      theme:
        light:
          starter: white
          custom: reveal.css
        dark:
          starter: black
          custom: reveal.css
  - exporter:
      buttons:
        - title: Baixa el PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
      formats:
        pdf:
          explicit: true
          concurrency: 1
          stylesheets:
            - pdf.scss
          browser:
            timeout: 120000

nav:
  - Inici: index.md
  - Informació del curs:
      - Programació: programacio.md
      - Criteris d'avaluació: criteris-avaluacio.md
      - Calendari: calendari.md
  - Material:
      - UD1: material/ud1/ud1.md
      - UD2: material/ud2/ud2.md
      - UD3: material/ud3/ud3.md
      - UD4: material/ud4/ud4.md
      - UD5: material/ud5/ud5.md
      - UD6: material/ud6/ud6.md
  - Activitats:
      - UD1:
          - Índex: activitats/ud1/index.md
          - Llegim el paisatge (UD01-A1): activitats/ud1/geo-01/index.md
          - Del mapa al relleu (UD01-A2): activitats/ud1/geo02/index.md
          - Com sabem què hi ha dins la Terra? (UD01-A3): activitats/ud1/interior-terra/index.md
          - Una Terra fragmentada (UD01-A4): activitats/ud1/terra-fragmentada/index.md
          - Tectònica en dades (UD01-A5): activitats/ud1/geo03/index.md
          - Llegim el temps a les roques (UD01-A6): activitats/ud1/geo04/index.md
          - Reconstruïm una història geològica (UD01-A7): activitats/ud1/g1/g1.md
          - Quan un procés natural esdevé risc? (UD01-A8): activitats/ud1/riscos/index.md
          - On construiríem? (UD01-A9): activitats/ud1/g2/index.md
          - Comprendre el risc (UD01-A10): activitats/ud1/g2-risc-evidencia/index.md
      - UD2:
          - Índex: activitats/ud2/index.md
      - UD3:
          - Índex: activitats/ud3/index.md
      - UD4:
          - Índex: activitats/ud4/index.md
      - UD5:
          - Índex: activitats/ud5/index.md
      - UD6:
          - Índex: activitats/ud6/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true

extra_css:
  - extra.css
  - presentacio.css
  - visor-ideib.css
  - activitats/ud1/geo04/geo04-tall.css

extra_javascript:
  - interaccio.js
  - visor-ideib.js
  - activitats/ud1/geo04/geo04-tall.js
