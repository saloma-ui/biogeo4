site_name: Biologia i Geologia — 4t d'ESO
site_description: Materials de Biologia i Geologia de 4t d'ESO
site_url: https://saloma-ui.github.io/biogeo4/
repo_url: https://github.com/saloma-ui/biogeo4
repo_name: saloma-ui/biogeo4

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - tags
  - revealjs:
      transition: slide
      controls: true
      center: true
      theme:
        light:
          starter: white
          custom: reveal.css
        dark:
          starter: black
          custom: reveal.css
  - exporter:
      buttons:
        - title: Baixa el PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
      formats:
        pdf:
          explicit: true
          concurrency: 1
          stylesheets:
            - pdf.scss
          browser:
            timeout: 120000

nav:
  - Inici: index.md
  - Informació del curs:
      - Programació: programacio.md
      - Criteris d'avaluació: criteris-avaluacio.md
      - Calendari: calendari.md
  - Material:
      - 'UD1 - Geologia': material/ud1/ud1.md
      - 'UD2 - La continuïtat cel·lular': material/ud2/ud2.md
      - 'UD3 - Informació genètica i herència': material/ud3/ud3.md
      - 'UD4 - Evolució': material/ud4/ud4.md
      - "UD5 - La Terra a l'univers": material/ud5/ud5.md
  - 'Ciència per descobrir':
      - Índex: divulgacio/index.md
      - 'Temes i etiquetes': divulgacio/temes.md
      - 'Per què relaxar un múscul també consumeix energia?': divulgacio/ud02/01-rel-calci.md
      - 'La fina línia que sosté la vida': divulgacio/ud02/02-fina-linia-vida.md
      - 'Monòxid de carboni: asfíxia cel·lular': divulgacio/ud02/03-gas-invisible.md
      - 'La trampa invisible dins les neurones': divulgacio/ud02/04-trampa-neurones.md
      - 'Sabotatge a la fàbrica de proteïnes': divulgacio/ud02/05-sabotatge-proteines.md
      - 'La proteïna que no arriba mai al seu destí': divulgacio/ud02/06-proteina-cftr.md
  - Activitats:
      - 'UD1 - Geologia':
          - 'Visió general': activitats/ud1/index.md
          - 'A01 · Llegim el paisatge': activitats/ud1/geo-01/index.md
          - 'A02 · Del mapa al relleu': activitats/ud1/geo02/index.md
          - 'A03 · Com sabem què hi ha dins la Terra?': activitats/ud1/interior-terra/index.md
          - 'A04 · Una Terra fragmentada': activitats/ud1/terra-fragmentada/index.md
          - 'A05 · Tectònica en dades': activitats/ud1/geo03/index.md
          - 'A06 · Llegim el temps a les roques': activitats/ud1/geo04/index.md
          - 'A07 · Reconstruïm una història geològica': activitats/ud1/g1/g1.md
          - 'A08 · Quan un procés natural esdevé un risc?': activitats/ud1/riscos/index.md
          - 'A09 · On construiríem?': activitats/ud1/g2/index.md
          - 'A10 · Comprendre el risc': activitats/ud1/g2-risc-evidencia/index.md
      - 'UD2 - La continuïtat cel·lular':
          - 'Visió general': activitats/ud2/index.md
          - 'A01 · La diversitat cel·lular': activitats/ud2/diversitat-cellular/index.md
      - 'UD3 - Informació genètica i herència':
          - 'Visió general': activitats/ud3/index.md
      - 'UD4 - Evolució':
          - 'Visió general': activitats/ud4/index.md
      - "UD5 - La Terra a l'univers":
          - 'Visió general': activitats/ud5/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true

extra_css:
  - extra.css
  - divulgacio/revista.css
  - presentacio.css
  - visor-ideib.css
  - activitats/ud1/geo04/geo04-tall.css

extra_javascript:
  - interaccio.js
  - divulgacio/revista.js
  - visor-ideib.js
  - activitats/ud1/geo04/geo04-tall.js
