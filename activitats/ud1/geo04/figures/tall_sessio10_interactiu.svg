<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Tall geològic interactiu per a la sessió 10</title>
  <desc id="desc">Tall geològic amb estrats inclinats A, B i C, intrusió X, superfície erosiva, estrat horitzontal D, falla F i superfície actual erosiva. Preparat amb identificadors i metadades per a una seqüència interactiva.</desc>

  <metadata id="interactive-sequence"><![CDATA[
{
  "version": "1.0",
  "language": "ca",
  "figure_id": "geo_s10_tall_interactiu",
  "features": {
    "unitat-a": "Estrat sedimentari A",
    "unitat-b": "Estrat sedimentari B",
    "unitat-c": "Estrat sedimentari C",
    "unitat-d": "Estrat horitzontal D",
    "intrusio-x": "Intrusió magmàtica X",
    "falla-f": "Falla F",
    "superficie-erosiva": "Superfície erosiva inferior",
    "superficie-actual": "Superfície actual erosiva",
    "abc": "Conjunt dels estrats A-B-C",
    "older-strata": "Estrats inclinats previs a D"
  },
  "steps": [
    {"id":"pas-1","title":"El repte","highlight":["unitat-a","unitat-b","unitat-c","unitat-d","intrusio-x","falla-f","superficie-actual"],"context":["superficie-erosiva"]},
    {"id":"pas-2","title":"Observa i identifica","highlight":["unitat-a","unitat-b","unitat-c","unitat-d","intrusio-x","falla-f","superficie-erosiva","superficie-actual"]},
    {"id":"pas-3","title":"Què és més antic: A, B o C?","highlight":["unitat-a","unitat-b","unitat-c"],"context":["contactes-inclinats"]},
    {"id":"pas-4","title":"Els estrats estan inclinats","highlight":["unitat-a","unitat-b","unitat-c"],"context":["contactes-inclinats"]},
    {"id":"pas-5","title":"Què ens diu X?","highlight":["intrusio-x"],"context":["unitat-a","unitat-b","unitat-c"]},
    {"id":"pas-6","title":"La superfície erosiva","highlight":["superficie-erosiva"],"context":["unitat-c","intrusio-x"]},
    {"id":"pas-7","title":"I D?","highlight":["unitat-d"],"context":["unitat-a","unitat-b","unitat-c","superficie-erosiva"]},
    {"id":"pas-8","title":"Finalment, F","highlight":["falla-f"],"context":["unitat-d","intrusio-x","unitat-c","unitat-b","unitat-a"]},
    {"id":"pas-9","title":"Reconstruïm la cronologia completa","highlight":["unitat-a","unitat-b","unitat-c","intrusio-x","superficie-erosiva","unitat-d","falla-f","superficie-actual"]},
    {"id":"pas-10","title":"Convertim la cronologia en història geològica","highlight":["unitat-a","unitat-b","unitat-c","intrusio-x","superficie-erosiva","unitat-d","falla-f","superficie-actual"]}
  ]
}
  ]]></metadata>

  <style>
    .geo-element { vector-effect: non-scaling-stroke; transition: opacity .2s ease, filter .2s ease, stroke-width .2s ease; }
    .feature { opacity: 1; }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #2b2927; }
    .unit-label { font-size: 34px; font-weight: 700; text-anchor: middle; }
    .surface-label { font-size: 25px; font-weight: 700; fill: #3b3733; }
    .surface-arrow { stroke: #3b3733; stroke-width: 2.5; fill: none; }
    .helper-line { stroke: #6f573d; stroke-width: 3; fill: none; }
    .bed-line { stroke: #a98a4a; stroke-width: 2; opacity: 0.75; fill: none; }
    .interactive-hidden { display: none; }
  </style>

