<svg xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc" version="1.1" id="svg8879" sodipodi:docname="geo04_05_moviment_p_s.svg"><title id="title">Moviment de les ones P i S</title><desc id="desc">Figura didàctica que compara la propagació d'una ona P i una ona S. A l'esquerra, una ona P amb moviment de les partícules paral·lel a la direcció de propagació. A la dreta, una ona S amb moviment de les partícules perpendicular a la direcció de propagació.</desc><defs id="defs8751"><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fbff" id="stop8724"/><stop offset="100%" stop-color="#eef4fb" id="stop8726"/></linearGradient><linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" id="stop8729"/><stop offset="100%" stop-color="#f7f9fc" id="stop8731"/></linearGradient><linearGradient id="particleBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9dd2ff" id="stop8734"/><stop offset="100%" stop-color="#3c87d0" id="stop8736"/></linearGradient><filter id="shadow" x="-0.0007751938" y="-0.0016260163" width="1.0015504" height="1.003252"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.22"/></filter><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8" id="path8740"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0,0 10,5 0,10 Z" fill="#ef6c00" id="path8743"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0,0 10,5 0,10 Z" fill="#0f766e" id="path8746"/></marker><style id="style8749">
